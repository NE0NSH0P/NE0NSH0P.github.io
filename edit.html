<style>
  .particles {
    position: fixed;   /* завжди поверх фону */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 0, 0, 0.8);
  }
</style>

<div class="particles"></div>

<script>
  let counter = 0;
  const container = document.querySelector('.particles');

  function createParticle() {
    const particle = document.createElement('div');
    particle.classList.add('particle');

    // випадковий розмір
    const size = Math.random() * 10 + 5;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';

    // випадкова стартова позиція по горизонталі
    const startX = Math.random() * window.innerWidth;
    particle.style.left = startX + 'px';
    particle.style.bottom = '0px'; // завжди стартує знизу

    // випадкова тривалість
    const duration = Math.random() * 5 + 3;

    // унікальне ім’я анімації
    const animName = `rise${counter++}`;

    // випадкові відхили вліво/вправо
    const offset1 = (Math.random() - 0.5) * 150;
    const offset2 = (Math.random() - 0.5) * 150;
    const offset3 = (Math.random() - 0.5) * 150;

    // створюємо keyframes
    const styleSheet = document.styleSheets[0];
    styleSheet.insertRule(`
      @keyframes ${animName} {
        0%   { transform: translateY(0) translateX(0); opacity: 1; }
        25%  { transform: translateY(-25vh) translateX(${offset1}px); }
        50%  { transform: translateY(-50vh) translateX(${offset2}px); }
        75%  { transform: translateY(-75vh) translateX(${offset3}px); }
        100% { transform: translateY(-100vh) translateX(0); opacity: 0; }
      }
    `, styleSheet.cssRules.length);

    particle.style.animation = `${animName} ${duration}s linear forwards`;

    container.appendChild(particle);

    setTimeout(() => {
      particle.remove();
    }, duration * 1000);
  }

  setInterval(createParticle, 400);
</script>

/* CSS для прев'ю. Замість <video> тепер YouTube <iframe>,
   тому клік ловить окремий прозорий .video-overlay поверх нього */
.wrapper {
    display: flex;
    flex-direction: column;
    gap: 150px;
}

.video-container {
    position: relative;
    margin-left: 150px;
    margin-top: 100px;
    width: 50%; /* ширину задає контейнер, бо в iframe немає "height: auto" по контенту */
}

.video-container iframe.yt-preview {
    display: block;
    width: 100%;
    aspect-ratio: 9 / 16; /* під вертикальні едіти; онови значення якщо в тебе горизонтальні */
    border-radius: 15px;
    pointer-events: none; /* клік проходить крізь iframe до .video-overlay */
    box-shadow: 0 0 40px rgba(255, 40, 40, 0.9);
    border: 10px solid transparent;
    background: linear-gradient(45deg, #8B0000, #B22222, #DC143C, #CD5C5C,#FFB6C1, pink, #800000,#FF0000,#FF6347,#FF0000, #800000, pink,#FFB6C1, #CD5C5C, #DC143C, #B22222, #8B0000);
    background-size: 500% 500%; /* Трохи збільшив для плавності */
    animation: borderGlow 5s ease infinite;
    transition: 0.25s ease;
}

@keyframes borderGlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.video-container:hover iframe.yt-preview {
    transform: scale(1.03);
}

.video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    aspect-ratio: 9 / 16;
    cursor: pointer;
    z-index: 2;
}

.text-block {
    position: absolute;
    top: 50%;
    left: 55%;
    transform: translateY(-50%);
    color: white;
    background-color: rgba(255, 0, 0, 0.55);
    padding: 20px;
    border-radius: 10px;
    font-size: 100px;
    pointer-events: none; /* Щоб клік проходив крізь текст на відео */
    z-index: 3;
}

.modal {
    display: none; /* Сховано за замовчуванням */
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
}

.modal iframe {
    width: min(90vw, 500px);
    aspect-ratio: 9 / 16;
    max-height: 90vh;
    border-radius: 15px;
    border: none;
}

.modal-close {
    position: absolute;
    top: 30px;
    right: 40px;
    font-size: 50px;
    color: white;
    cursor: pointer;
    z-index: 10000;
}
</style>

<script>
    const modal = document.getElementById('modal');
    const modalVideo = document.getElementById('modal-video');

    // Функція відкриття - тепер приймає YouTube videoId замість шляху до файлу
    function openModal(videoId) {
        modalVideo.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&rel=0&modestbranding=1";
        modal.style.display = "flex";
    }

    // Функція закриття
    function closeModal() {
        modal.style.display = "none";
        modalVideo.src = ""; // Очищуємо src, щоб відео зупинилось і не грало у фоні
    }

    // Закриття при кліку на фон (поза відео)
    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal();
        }
    }
</script>
