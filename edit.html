<style>
  .particles {
    position: fixed;   /* завжди поверх фону */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 0, 0, 0.8);
  }
</style>

<div class="particles"></div>

<script>
  let counter = 0;
  const container = document.querySelector('.particles');

  function createParticle() {
    const particle = document.createElement('div');
    particle.classList.add('particle');

    // випадковий розмір
    const size = Math.random() * 10 + 5;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';

    // випадкова стартова позиція по горизонталі
    const startX = Math.random() * window.innerWidth;
    particle.style.left = startX + 'px';
    particle.style.bottom = '0px'; // завжди стартує знизу

    // випадкова тривалість
    const duration = Math.random() * 5 + 3;

    // унікальне ім’я анімації
    const animName = `rise${counter++}`;

    // випадкові відхили вліво/вправо
    const offset1 = (Math.random() - 0.5) * 150;
    const offset2 = (Math.random() - 0.5) * 150;
    const offset3 = (Math.random() - 0.5) * 150;

    // створюємо keyframes
    const styleSheet = document.styleSheets[0];
    styleSheet.insertRule(`
      @keyframes ${animName} {
        0%   { transform: translateY(0) translateX(0); opacity: 1; }
        25%  { transform: translateY(-25vh) translateX(${offset1}px); }
        50%  { transform: translateY(-50vh) translateX(${offset2}px); }
        75%  { transform: translateY(-75vh) translateX(${offset3}px); }
        100% { transform: translateY(-100vh) translateX(0); opacity: 0; }
      }
    `, styleSheet.cssRules.length);

    particle.style.animation = `${animName} ${duration}s linear forwards`;

    container.appendChild(particle);

    setTimeout(() => {
      particle.remove();
    }, duration * 1000);
  }

  setInterval(createParticle, 400);
</script>

		<style>
/* CSS для прев'ю. Список самих едітів (id відео + ціна) тепер живе
   в масиві EDITS у скрипті нижче - щоб замінити/додати відео, туди й треба
   заглядати, тут у CSS міняти нічого не потрібно. */
.wrapper {
    display: flex;
    flex-direction: column;
    gap: 150px;
}

.video-container {
    position: relative;
    margin-left: 150px;
    margin-top: 100px;
    --ar: 9 / 16; /* запасні пропорції, поки не підвантажились реальні (див. скрипт) */
}

.video-container iframe.yt-preview,
.video-container .video-overlay {
    display: block;
    width: 50%;
    aspect-ratio: var(--ar); /* реальні пропорції відео - рамка точно по краях, без чорних смуг */
    border-radius: 15px;
}

.video-container iframe.yt-preview {
    pointer-events: none; /* клік проходить крізь iframe до .video-overlay */
    box-shadow: 0 0 40px rgba(255, 40, 40, 0.9);
    border: 10px solid transparent;
    background: linear-gradient(45deg, #8B0000, #B22222, #DC143C, #CD5C5C,#FFB6C1, pink, #800000,#FF0000,#FF6347,#FF0000, #800000, pink,#FFB6C1, #CD5C5C, #DC143C, #B22222, #8B0000);
    background-size: 500% 500%; /* Трохи збільшив для плавності */
    animation: borderGlow 5s ease infinite;
    transition: 0.25s ease;
}

@keyframes borderGlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.video-container:hover iframe.yt-preview {
    transform: scale(1.03);
}

.video-container .video-overlay {
    position: absolute;
    top: 0;
    left: 0;
    cursor: pointer;
    z-index: 2;
}

.text-block {
    position: absolute;
    top: 50%;
    left: 55%;
    transform: translateY(-50%);
    color: white;
    background-color: rgba(255, 0, 0, 0.55);
    padding: 20px;
    border-radius: 10px;
    font-size: 100px;
    pointer-events: none; /* Щоб клік проходив крізь текст на відео */
    z-index: 3;
    white-space: nowrap;
}

.modal {
    display: none; /* Сховано за замовчуванням */
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
    --modal-ar: 9 / 16;
}

.modal iframe {
    width: min(90vw, 500px);
    aspect-ratio: var(--modal-ar);
    max-height: 90vh;
    border-radius: 15px;
    border: none;
}

.modal-close {
    position: absolute;
    top: 30px;
    right: 40px;
    font-size: 50px;
    color: white;
    cursor: pointer;
    z-index: 10000;
}
</style>

<div class="wrapper" id="wrapper"></div>

<div id="modal" class="modal">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <iframe id="modal-video" src="" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
</div>

<script>
    // === Список едітів ===
    // Щоб замінити відео (наприклад, коли переллєш на інший акаунт) - просто зміни
    // "id" на новий (це частина посилання після youtu.be/). Ціну і порядок можна
    // міняти як завгодно, кількість рядків теж можна збільшувати/зменшувати.
    // "ratio" - реальні пропорції відео "ширина / висота" (напр. "1080 / 1920").
    // Якщо не вказати - береться запасне значення 9 / 16. Як дізнатись реальні пропорції:
    // відкрий відео на YouTube -> правою кнопкою по відео -> "Stats for nerds" ->
    // рядок "Viewport / Frames" покаже щось типу "1080x1920" - це і є ratio.
    const EDITS = [
        { id: '6s6qQhlAKdY', price: '15$' },   // edit15
        { id: '93vBYIAo77A', price: '15$' },   // edit15(2)
        { id: 'vdRqkeCl4mc', price: '15$' },   // edit15(3)
        { id: 'qu3VLey--_Q', price: '10$' },   // edit10
        { id: '_qcHxSbcOuA', price: '10$' },   // edit10(2)
        { id: 'WOw9RZWBT4Y', price: '11$' },   // edit11
        { id: 'IsFAN-Qo3f0', price: '12$' },   // edit12
        { id: 'knpPoWSSe7g', price: '13$' },   // edit13
        { id: 'MLeAMwooEhA', price: '14$' },   // edit14
        { id: '7uF_mGDqqKM', price: '15$' },   // edit15(4)
        { id: 'sRbG2GYHTJg', price: '22$' },   // edit22
        { id: 'DeLxBZ99MLQ', price: '25$' },   // edit25
    ];

    const wrapper = document.getElementById('wrapper');
    const modal = document.getElementById('modal');
    const modalVideo = document.getElementById('modal-video');
    const ratios = {}; // id -> ratio, щоб і модалка відкривала відео без чорних смуг

    EDITS.forEach(edit => {
        const ar = edit.ratio || '9 / 16';
        ratios[edit.id] = ar;

        const container = document.createElement('div');
        container.className = 'video-container';
        container.style.setProperty('--ar', ar);

        const iframe = document.createElement('iframe');
        iframe.className = 'yt-preview';
        iframe.src = 'https://www.youtube.com/embed/' + edit.id +
            '?autoplay=1&mute=1&loop=1&playlist=' + edit.id +
            '&controls=0&modestbranding=1&rel=0&playsinline=1';
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'autoplay; encrypted-media');

        const overlay = document.createElement('div');
        overlay.className = 'video-overlay';
        overlay.onclick = () => openModal(edit.id);

        const textBlock = document.createElement('div');
        textBlock.className = 'text-block';
        textBlock.textContent = edit.price;

        container.append(iframe, overlay, textBlock);
        wrapper.appendChild(container);
    });

    // Функція відкриття - приймає YouTube videoId
    function openModal(videoId) {
        modalVideo.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0&modestbranding=1';
        modal.style.setProperty('--modal-ar', ratios[videoId] || '9 / 16');
        modal.style.display = 'flex';
    }

    // Функція закриття
    function closeModal() {
        modal.style.display = 'none';
        modalVideo.src = ''; // Очищуємо src, щоб відео зупинилось і не грало у фоні
    }

    // Закриття при кліку на фон (поза відео)
    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal();
        }
    }
</script>
