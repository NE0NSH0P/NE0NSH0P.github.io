<!-- Кнопка вмик/вимк музики -->
<button id="music-btn" onclick="toggleMusic()">▶ Play Music</button>

<!-- Кнопки регулювання гучності -->
<button id="vol-up" onclick="changeVolume(0.1)">+</button>
<button id="vol-down" onclick="changeVolume(-0.1)">−</button>

<!-- Аудіо приховане -->
<audio id="bg-music" loop>
  <source src="музика на фон.mp3" type="audio/mpeg">
</audio>

<script>
  function toggleMusic() {
    const audio = document.getElementById('bg-music');
    const btn = document.getElementById('music-btn');
    if (audio.paused) {
      audio.play();
      btn.textContent = "⏸ Pause Music";
    } else {
      audio.pause();
      btn.textContent = "▶ Play Music";
    }
  }

  function changeVolume(delta) {
    const audio = document.getElementById('bg-music');
    let newVolume = audio.volume + delta;
    if (newVolume > 1) newVolume = 1;   // максимум 100%
    if (newVolume < 0) newVolume = 0;   // мінімум 0%
    audio.volume = newVolume;
  }
</script>

<style>
  /* стилізація кнопки музики */

  <!-- частинки які вилітають з курсора -->
<script>
  const particles = [];
  const spawnInterval = 300; // 0.3 сек
  const particlesPerSpawn = 5;
  const isMobile = /Mobi|Android/i.test(navigator.userAgent);

  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let spawnTimer = null;

  if (!isMobile) {
    document.addEventListener("mousemove", e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function spawnParticles() {
      for (let i = 0; i < particlesPerSpawn; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        document.body.appendChild(p);

        // випадковий напрямок
        const angle = Math.random() * 2 * Math.PI;
        const speed = 3 + Math.random() * 2;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        particles.push({
          el: p,
          x: mouseX,
          y: mouseY,
          vx: vx,
          vy: vy,
          opacity: 0.6,
          life: 120
        });
      }
    }

    function animate() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        // поступове уповільнення
        p.vx *= 0.97;
        p.vy *= 0.97;

        // зменшення життя та прозорості
        p.life--;
        p.opacity = p.life / 120 * 0.6;

        p.el.style.left = p.x + "px";
        p.el.style.top = p.y + "px";
        p.el.style.opacity = p.opacity;

        if (
          p.life <= 0 ||
          p.x < 0 || p.x > window.innerWidth ||
          p.y < 0 || p.y > window.innerHeight
        ) {
          p.el.remove();
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    // запуск анімації
    animate();

    // запуск таймера створення частинок
    function startSpawning() {
      if (!spawnTimer) {
        spawnTimer = setInterval(spawnParticles, spawnInterval);
      }
    }

    function stopSpawning() {
      if (spawnTimer) {
        clearInterval(spawnTimer);
        spawnTimer = null;
      }
    }

    // відслідковування видимості сторінки
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopSpawning();
      } else {
        startSpawning();
      }
    });

    // старт при завантаженні
    startSpawning();
  }
</script>

<style>
