		<!-- Скрипти -->
		<script>
		  function toggleMusic() {
		    const audio = document.getElementById('bg-music');
		    const btn = document.getElementById('music-btn');
		    if (audio.paused) {
		      audio.play();
		      btn.textContent = "⏸ Pause Music";
		    } else {
		      audio.pause();
		      btn.textContent = "▶ Play Music";
		    }
		  }

		  function changeVolume(delta) {
		    const audio = document.getElementById('bg-music');
		    let newVolume = audio.volume + delta;
		    if (newVolume > 1) newVolume = 1;
		    if (newVolume < 0) newVolume = 0;
		    audio.volume = newVolume;
		  }

		  function openPriceList() {
		    window.location.href = "./прайс лист.html";
		  }
		</script>

		<!-- Анімація частинок -->
		<script>
		  const particles = [];
		  const spawnInterval = 300;
		  const particlesPerSpawn = 5;
		  const isMobile = /Mobi|Android/i.test(navigator.userAgent);

		  let mouseX = window.innerWidth / 2;
		  let mouseY = window.innerHeight / 2;
		  let spawnTimer = null;

		  if (!isMobile) {
		    document.addEventListener("mousemove", e => {
		      mouseX = e.clientX;
		      mouseY = e.clientY;
		    });

		    function spawnParticles() {
		      for (let i = 0; i < particlesPerSpawn; i++) {
		        const p = document.createElement("div");
		        p.className = "particle";
		        document.body.appendChild(p);

		        const angle = Math.random() * 2 * Math.PI;
		        const speed = 3 + Math.random() * 2;
		        const vx = Math.cos(angle) * speed;
		        const vy = Math.sin(angle) * speed;

		        particles.push({
		          el: p,
		          x: mouseX,
		          y: mouseY,
		          vx: vx,
		          vy: vy,
		          opacity: 0.6,
		          life: 120
		        });
		      }
		    }

		    function animate() {
		      for (let i = particles.length - 1; i >= 0; i--) {
		        const p = particles[i];
		        p.x += p.vx;
		        p.y += p.vy;
		        p.vx *= 0.97;
		        p.vy *= 0.97;
		        p.life--;
		        p.opacity = p.life / 120 * 0.6;

		        p.el.style.left = p.x + "px";
		        p.el.style.top = p.y + "px";
		        p.el.style.opacity = p.opacity;

		        if (p.life <= 0 || p.x < 0 || p.x > window.innerWidth || p.y < 0 || p.y > window.innerHeight) {
		          p.el.remove();
		          particles.splice(i, 1);
		        }
		      }
		      requestAnimationFrame(animate);
		    }

		    animate();

		    function startSpawning() {
		      if (!spawnTimer) {
		        spawnTimer = setInterval(spawnParticles, spawnInterval);
		      }
		    }

		    function stopSpawning() {
		      if (spawnTimer) {
		        clearInterval(spawnTimer);
		        spawnTimer = null;
		      }
		    }

		    document.addEventListener("visibilitychange", () => {
		      if (document.hidden) {
		        stopSpawning();
		      } else {
		        startSpawning();
		      }
		    });

		    startSpawning();
		  }
		</script>
