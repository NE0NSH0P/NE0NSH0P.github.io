<!-- частинки які летять до курсора  -->
 <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    // оновлення позиції курсора (точно по canvas)
    canvas.addEventListener("mousemove", e => {
      mouse.x = e.offsetX;
      mouse.y = e.offsetY;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = 2;
        this.baseSize = this.size;
      }
      update() {
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        let speed = Math.min(5, 100 / dist);

        this.x += dx / dist * speed;
        this.y += dy / dist * speed;

        // якщо частинка дуже близько до курсора — зникає
        if (dist < this.size + 2) {
          this.size -= 0.3;
          if (this.size <= 0) {
            this.size = 0;
          }
        }
      }
      draw() {
        if (this.size > 0) {
          // градієнт для світіння
          let gradient = ctx.createRadialGradient(
            this.x, this.y, 0,
            this.x, this.y, this.size * 3
          );
          gradient.addColorStop(0, "rgba(255,255,255,1)");   // білий центр
          gradient.addColorStop(0.4, "rgba(255,100,150,0.8)"); // рожево-червоний
          gradient.addColorStop(1, "rgba(150,0,0,0.2)");     // темно-червоний край

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function initParticles(num) {
      for (let i = 0; i < num; i++) {
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.update();
        p.draw();
        if (p.size <= 0) {
          particles.splice(i, 1);
          particles.push(new Particle()); // додаємо нову
        }
      });
      requestAnimationFrame(animate);
    }

    function isMobile() {
      return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) 
             || navigator.maxTouchPoints > 1;
    }

    if (!isMobile()) {
      initParticles(100); // кількість частиць на екрані
      animate();
    }
  </script>

<!-- Аудіо приховане -->
<audio id="bg-music" loop>
  <source src="музика на фон 2.mp3" type="audio/mpeg">
</audio>

<script>
  function toggleMusic() {
    const audio = document.getElementById('bg-music');
    const btn = document.getElementById('music-btn');
    if (audio.paused) {
      audio.play();
      btn.textContent = "⏸ Pause Music";
    } else {
      audio.pause();
      btn.textContent = "▶ Play Music";
    }
  }

  function changeVolume(delta) {
    const audio = document.getElementById('bg-music');
    let newVolume = audio.volume + delta;
    if (newVolume > 1) newVolume = 1;   // максимум 100%
    if (newVolume < 0) newVolume = 0;   // мінімум 0%
    audio.volume = newVolume;
  }
</script>

<!-- скрипт відстеження для прогрес бару відео для фона -->
<script>
  const bgVideo = document.querySelector('.video-background video');
  const progressBar = document.getElementById('video-progress-bar');

  if (bgVideo && progressBar) {
    // Відстежуємо завантаження буфера відео
    bgVideo.addEventListener('progress', () => {
      if (bgVideo.duration > 0 && bgVideo.buffered.length > 0) {
        const bufferedEnd = bgVideo.buffered.end(bgVideo.buffered.length - 1);
        const percent = (bufferedEnd / bgVideo.duration) * 100;
        progressBar.style.width = percent + '%';
      }
    });

    // Ховаємо смужку, коли відео повністю завантажилося і почало грати
    bgVideo.addEventListener('canplaythrough', () => {
      progressBar.style.width = '100%';
      setTimeout(() => {
        progressBar.style.opacity = '0';
      }, 300);
    });
  }
</script>
